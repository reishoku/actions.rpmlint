name: rpmlint
description: Run rpmlint on RPM spec files
branding:
  icon: check-circle
  color: blue

inputs:
  config:
    description: Path to rpmlint configuration file
    required: false
    default: .rpmlint.toml
  path:
    description: Directory to search for spec files
    required: false
    default: .
  depth:
    description: Maximum directory depth to search for spec files (1 = current directory only)
    required: false
    default: '1'
  strict:
    description: Treat warnings as errors (--strict)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install rpmlint
      shell: bash
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          --no-install-suggests \
          rpmlint

    - name: Find spec files
      shell: bash
      env:
        LANG: C
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DEPTH: ${{ inputs.depth }}
      run: |
        set -euo pipefail
        SPEC_LIST="${RUNNER_TEMP}/spec-files.txt"
        find "${INPUT_PATH}" \
          -mindepth 1 -maxdepth "${INPUT_DEPTH}" \
          -type f -name '*.spec' ! -empty \
          -print | sort > "${SPEC_LIST}"
        {
          echo "SPEC_LIST=${SPEC_LIST}"
          echo "SPEC_COUNT=$(wc -l < "${SPEC_LIST}")"
        } >> "${GITHUB_ENV}"

    - name: List found spec files
      if: env.SPEC_COUNT != '0'
      shell: bash
      env:
        LANG: C
      run: |
        echo "::notice::Found ${SPEC_COUNT} spec file(s)"
        while IFS= read -r f; do
          echo "::notice file=${f}::${f}"
        done < "${SPEC_LIST}"

    - name: Warn if no spec files found
      if: env.SPEC_COUNT == '0'
      shell: bash
      env:
        LANG: C
        INPUT_PATH: ${{ inputs.path }}
      run: |
        echo "::warning::No spec files found in '${INPUT_PATH}'"

    - name: Check rpmlint configuration
      if: env.SPEC_COUNT != '0'
      shell: bash
      env:
        LANG: C
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        if [ -f "${INPUT_CONFIG}" ]; then
          echo "RPMLINT_CONFIG=-c ${INPUT_CONFIG}" >> "${GITHUB_ENV}"
        fi

    - name: Run rpmlint
      if: env.SPEC_COUNT != '0'
      shell: bash
      env:
        LANG: C
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        strict_flag=""
        if [ "${INPUT_STRICT}" = "true" ]; then
          strict_flag="--strict"
        fi
        mapfile -t specs < "${SPEC_LIST}"
        # shellcheck disable=SC2086
        rpmlint ${RPMLINT_CONFIG:-} ${strict_flag} "${specs[@]}"
