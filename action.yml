name: rpmlint
description: Run rpmlint on RPM spec files
branding:
  icon: check-circle
  color: blue

inputs:
  config:
    description: Path to rpmlint configuration file
    required: false
    default: .rpmlint.toml
  path:
    description: Directory to search for spec files
    required: false
    default: .
  depth:
    description: Maximum directory depth to search for spec files (1 = current directory only)
    required: false
    default: '1'
  strict:
    description: Treat warnings as errors (--strict)
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install rpmlint
      shell: bash
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install -y \
          --no-install-suggests \
          rpmlint

    - name: Find spec files
      id: find-spec
      shell: bash
      env:
        LANG: C
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DEPTH: ${{ inputs.depth }}
      run: |
        set -euo pipefail
        find "${INPUT_PATH}" \
          -mindepth 1 -maxdepth "${INPUT_DEPTH}" \
          -type f -name '*.spec' ! -empty \
          -print | sort > "${RUNNER_TEMP}/spec-files.txt"
        count="$(wc -l < "${RUNNER_TEMP}/spec-files.txt")"
        echo "count=${count}" >> "${GITHUB_OUTPUT}"

    - name: List found spec files
      if: steps.find-spec.outputs.count != '0'
      shell: bash
      env:
        LANG: C
      run: |
        count="$(wc -l < "${RUNNER_TEMP}/spec-files.txt")"
        echo "::notice::Found ${count} spec file(s)"
        while IFS= read -r f; do
          echo "::notice file=${f}::${f}"
        done < "${RUNNER_TEMP}/spec-files.txt"

    - name: Warn if no spec files found
      if: steps.find-spec.outputs.count == '0'
      shell: bash
      env:
        LANG: C
        INPUT_PATH: ${{ inputs.path }}
      run: |
        echo "::warning::No spec files found in '${INPUT_PATH}'"

    - name: Check rpmlint configuration
      id: config
      if: steps.find-spec.outputs.count != '0'
      shell: bash
      env:
        LANG: C
        INPUT_CONFIG: ${{ inputs.config }}
      run: |
        if [ -f "${INPUT_CONFIG}" ]; then
          echo "args=-c ${INPUT_CONFIG}" >> "${GITHUB_OUTPUT}"
        fi

    - name: Run rpmlint
      if: steps.find-spec.outputs.count != '0'
      shell: bash
      env:
        LANG: C
        CONFIG_ARGS: ${{ steps.config.outputs.args }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        strict_flag=""
        if [ "${INPUT_STRICT}" = "true" ]; then
          strict_flag="--strict"
        fi
        mapfile -t specs < "${RUNNER_TEMP}/spec-files.txt"
        # shellcheck disable=SC2086
        rpmlint ${CONFIG_ARGS} ${strict_flag} "${specs[@]}"
